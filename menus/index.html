<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menuria One</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Tu CSS esistente -->
  <link rel="stylesheet" href="/menus/menus.css">
   <!-- Icon-based allergen bar CSS -->
  <link rel="stylesheet" href="/static/css/allergen_icons.css">
</head>
<body>
  <header class="top-header">
    <div class="top-row">
      <div class="left-section language-flags">
        <!-- bandiere -->
        <img src="/static/img/flags/Spain-flag.png" alt="ES" onclick="setLanguage('es')" class="active">
        <img src="/static/img/flags/UK-flag.png" alt="EN" onclick="setLanguage('en')">
        <img src="/static/img/flags/Italy-flag.png" alt="IT" onclick="setLanguage('it')">
        <img src="/static/img/flags/France-flag.png" alt="FR" onclick="setLanguage('fr')">
        <img src="/static/img/flags/Germany-flag.png" alt="DE" onclick="setLanguage('de')">
        <img src="/static/img/flags/Portugal-flag.png" alt="PT" onclick="setLanguage('pt')">
        <img src="/static/img/flags/Russia-flag.png" alt="RU" onclick="setLanguage('ru')">
      </div>

      <div class="center-section">
        <h1 class="main-title" data-i18n="home_title">Restaurante La Casita del Nazareno</h1>
      </div>

      <div class="right-section">
        <a href="/home/index.html" class="home-button">🏠 Home</a>
      </div>
    </div>
  </header>

  <div class="header-spacer"></div>

  <section>
    <div class="container" id="menuContainer">
      <div class="logo">
        <img src="static/img/lacasitabackgrnd.png" alt="Logo La Casita" />
      </div>

      <!-- 🔹 Griglia categorie -->
      <div id="menu-grid" class="menu-grid-host" aria-label="Selezione rapida categorie"></div>

      <!-- 🔹 Filtri allergeni a icone -->
      <div id="allergen-icons" class="allergen-icons-host" aria-label="Filtri allergeni"></div>

      <!-- 🔹 Contenuto dei menu renderizzato -->
      <div id="menu-content"></div>

      <!-- (Legacy) elementi usati dal tuo JS originale: li lasciamo per compatibilità -->
      <div class="menu-title" id="menuTitle" hidden></div>
      <div class="menu-note" id="menuNote" hidden></div>
      <table id="menuTable" hidden></table>
      <div class="menu-nav" hidden>
        <button class="arrow-btn" id="prevBtn" title="Menú anterior">&#8592;</button>
        <span id="menuIndicator" style="font-weight:700;color:#3f5d77;"></span>
        <button class="arrow-btn" id="nextBtn" title="Menú siguiente">&#8594;</button>
      </div>

      <div class="note" data-i18n="menu_note">
        Precios IVA incluido · Ambiente familiar y casero
      </div>
    </div>
  </section>

  <!-- Footer Ristorante -->
  <footer class="restaurant-footer">
    <h3 id="rFoot1" data-i18n="footer_restaurant_contact">Contactanos - Restaurante La Casita del Nazareno</h3>
    <div class="social-links">
      <a href="https://facebook.com">👍</a>
      <a href="https://instagram.com">📸</a>
      <a href="https://twitter.com">🐦</a>
    </div>
  </footer>

  <!-- Footer Menuria -->
  <footer class="menuria-footer">
    <h3 id="rFoot2" data-i18n="footer_menuria_contact">Contactanos - Menuria</h3>
    <div class="social-links">
      <a href="https://facebook.com">👍</a>
      <a href="https://instagram.com">📸</a>
      <a href="https://twitter.com">🐦</a>
    </div>
  </footer>

<script src="/menus/menus.js"></script>        <!-- espone window.menus + MenuUI -->
<script src="/static/js/allergen_rules.js"></script>
<script src="/static/js/allergen_icons_ui.js"></script>


  <!-- Boot: griglia + icone + primo render -->
  <script>
document.addEventListener('DOMContentLoaded', function(){
  if (window.MenuUI && typeof MenuUI.renderMenuGrid === 'function') {
    MenuUI.renderMenuGrid('menu-grid');
  } else {
    console.error('MenuUI mancante: controlla l’export in /menus/menus.js');
  }

  if (window.AllergenIcons && typeof AllergenIcons.mount === 'function') {
    AllergenIcons.mount('allergen-icons','menu-content');
  }

  // failsafe: se ancora vuoto, render completo senza filtri
  setTimeout(function(){
    if (!document.querySelector('#menu-content .menu-item') && window.MenuUI) {
      MenuUI.renderMenus(window.menus || [], 'menu-content');
    }
  }, 0);
});
</script>


  <noscript>Per favore abilita JavaScript per visualizzare il menu.</noscript>
</body>
</html>
