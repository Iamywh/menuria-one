<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería - La Casita</title>
  <link rel="stylesheet" href="gallery.css">
  <script defer src="gallery.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #f1f1f1;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #333;
    }

    .lang-switch img {
      width: 28px;
      height: 20px;
      margin-left: 10px;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .lang-switch img:hover {
      transform: scale(1.1);
    }

    .go-home a {
      color: #f1f1f1;
      text-decoration: none;
      font-size: 1.1rem;
    }

    .gallery-intro {
      text-align: center;
      padding: 40px 20px;
    }

    .gallery-intro h1 {
      font-size: 2.8rem;
      margin-bottom: 15px;
      color: #ffc107;
    }

    .gallery-intro p {
      font-size: 1.1rem;
      color: #ccc;
    }

    .gallery-section {
      padding: 40px 20px;
      max-width: fit-content;
      margin: 0 auto;
    }

    .gallery-section h2 {
      font-size: 2rem;
      margin-bottom: 25px;
      border-left: 5px solid #ffc107;
      padding-left: 10px;
      color: #ffc107;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .gallery-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .gallery-grid img:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(255, 193, 7, 0.3);
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: #1e1e1e;
      color: #aaa;
      font-size: 0.9rem;
    }
    #gallery {
  padding: 20px;
  overflow: hidden;
  background-color: #111;
}

.gallery-row {
  display: flex;
  gap: 16px;
  padding: 10px 0;
}

.gallery-row img {
  height: 220px;
  border-radius: 10px;
  min-width: 250px;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform 0.3s ease;
}

.gallery-row img:hover {
  transform: scale(1.05);
}

/* Animazioni */
.scroll-right {
  animation: scrollRight 40s linear infinite;
}

.scroll-left {
  animation: scrollLeft 40s linear infinite;
}

@keyframes scrollRight {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

@keyframes scrollLeft {
  0% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}
#lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  padding: 20px;
}

#lightbox img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

#close-lightbox {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 32px;
  color: #fff;
  cursor: pointer;
}
@media (max-width: 768px) {
  .gallery-row img {
    height: 150px;
  }
}
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galería - La Casita</title>
  <link rel="stylesheet" href="gallery.css">
  <script defer src="gallery.js"></script>
</head>
<body>
  <!-- HEADER CON BANDIERINE E GO HOME -->
  <header class="top-header">
        <div class="lang-switch">
            <!-- Bandiere -->
            <div class="left-section language-flags">
                <img src="{{ url_for('static', filename='img/flags/Spain-flag.png') }}" alt="ES" onclick="setLanguage('es')" class="active">
                <img src="{{ url_for('static', filename='img/flags/UK-flag.png') }}" alt="EN" onclick="setLanguage('en')">
                <img src="{{ url_for('static', filename='img/flags/Italy-flag.png') }}" alt="IT" onclick="setLanguage('it')">
                <img src="{{ url_for('static', filename='img/flags/France-flag.png') }}" alt="FR" onclick="setLanguage('fr')">
                <img src="{{ url_for('static', filename='img/flags/Germany-flag.png') }}" alt="DE" onclick="setLanguage('de')">
                <img src="{{ url_for('static', filename='img/flags/Portugal-flag.png') }}" alt="PT" onclick="setLanguage('pt')">
                <img src="{{ url_for('static', filename='img/flags/Russia-flag.png') }}" alt="RU" onclick="setLanguage('ru')">
            </div>
      <div class="go-home">
      <a href="templates/index.html" data-i18n="go_home">🏠 Home</a>
    </div>
</div>
</header>

  <!-- TITOLO PRINCIPALE -->
  <section class="gallery-intro">

  <!-- GALLERIA A SEZIONI -->
 <section class="gallery-section" id="piatti">

    <img src="static/img/galleries/platos/tostamozzarella.jpg" alt="piatto3">
    <img src="static/img/galleries/platos/tostasolomillo.jpg" alt="piatto4">
    <img src="static/img/galleries/platos/Wokternera.jpg" alt="piatto5">
    <img src="static/img/galleries/platos/Wokpollo.jpg" alt="piatto6">
    <img src="static/img/galleries/platos/Woklangostinos.jpg" alt="piatto7">
    <img src="static/img/galleries/platos/saquitos.jpg" alt="piatto8">
    <img src="static/img/galleries/platos/Hcalabacin.jpg" alt="piatto9">
    <img src="static/img/galleries/platos/Hternera.jpg" alt="piatto10">

<section class="gallery-section" id="cocktail">

    <img src="static/img/galleries/cocktail/Bluelemondrop.jpg" alt="cocktail1">
    <img src="static/img/galleries/cocktail/Mojito-classic.jpg" alt="cocktail2">
    <img src="static/img/galleries/cocktail/Mojito-classic+strawberry.jpg" alt="cocktail3">
    <img src="static/img/galleries/cocktail/Mojito-strawberry.jpg" alt="cocktail4">
  </div>
</section>

<section class="gallery-section" id="torte">
    <h2 data-i18n="gallery_torte">Nuestras tartas</h2>
    <div class="gallery-row scroll-right">
      <img src="static/img/galleries/tartas/Tkinder.jpg" alt="torta1">
      <img src="static/img/galleries/tartas/Tcolibri.jpg" alt="torta2">
      <img src="static/img/galleries/tartas/Tchocoframbuesa.png" alt="torta3">
      <img src="static/img/galleries/tartas/angelsfood.jpg" alt="torta4">
      <img src="static/img/galleries/tartas/Tmanzana.png" alt="torta5">
    </div>
  </section>

<section class="gallery-section" id="caffe">
  <h2 data-i18n="gallery_caffe">Nuestros cafés</h2>
  <div class="gallery-row scroll-right">
    <img src="gallery/caffe1.jpg" alt="caffe1">
    <img src="gallery/caffe2.jpg" alt="caffe2">
    <img src="gallery/caffe3.jpg" alt="caffe3">
  </div>
</section>

  <footer class="footer">
    <p>&copy; 2025 La Casita del Nazareno</p>
  </footer>
  <!-- Lightbox container -->
<div id="lightbox" style="display:none;">
  <span id="close-lightbox">✖</span>
  <img id="lightbox-img" src="" alt="Zoomed">
</div>

<script>
  const images = document.querySelectorAll('.gallery-row img');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const closeBtn = document.getElementById('close-lightbox');

  images.forEach(img => {
    img.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = img.src;
    });
  });

  closeBtn.addEventListener('click', () => {
    lightbox.style.display = 'none';
  });
</script>

</body>
</html>
