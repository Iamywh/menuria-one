<head>

  <title>Gallery</title>

  <!-- Font Awesome: DEVE stare in ogni pagina (o in un layout comune) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Stili/JS condivisi -->

<body>
<div id="header-placeholder"></div>

    <button data-filter="platos" data-i18n="filter_platos">Platos</button>
    <button data-filter="cocktail" data-i18n="filter_cocktail">Cocktails</button>
    <button data-filter="tartas" data-i18n="filter_tartas">Tartas</button>
    <button data-filter="cafe" data-i18n="filter_cafe">Cafés</button>

</section>

  <script src="/static/js/i18n.js"></script>
<div id="footer-placeholder"></div>
</body>
 <!-- Footer Ristorante -->
<script src="/static/js/i18n.js"></script>
 <script>
Promise.all([
  fetch("../templates/header.html").then(r => r.text()),
  fetch("../templates/footer.html").then(r => r.text())
]).then(([headerHtml, footerHtml]) => {
  document.getElementById("header-placeholder").innerHTML = headerHtml;
  document.getElementById("footer-placeholder").innerHTML = footerHtml;

  if (window.initHeader) window.initHeader();
});
</script>
</html>
